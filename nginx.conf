# ═══════════════════════════════════════════════════════════════
#  Nginx — Reverse Proxy para SOAP Psiquiatria
# ═══════════════════════════════════════════════════════════════
#
# Serviços:
#   - /           → serve index.html (frontend estático)
#   - /api/*      → proxy para backend Flask (porta 5000)
#
# Notas de produção:
#   - Para HTTPS, usar certbot/manual e descomentar blocos ssl.
#   - Fazer ajuste de worker_processes para o número de núcleos.
#   - Adicionar rate limiting se necessário em /api/*.
# ═══════════════════════════════════════════════════════════════

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Log format ─────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Gzip ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Upstream: Backend Flask ────────────────────────────────
    upstream backend {
        server backend:5000;
        keepalive 32;
    }

    # ── Servir frontend estático ───────────────────────────────
    server {
        listen 80;
        server_name _;

        root /app;
        index index.html;

        # Frontend: qualquer rota que não seja /api/* serve o HTML
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── API: proxy para Flask ─────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts (a API faz requests externos ao PubMed/PharmGKB
            # que podem levar alguns segundos)
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 90s;

            # Sem cache nas respostas da API
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # ── Health check ───────────────────────────────────────
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # ── HTTPS (descomentar quando tiver certificado) ────────────
