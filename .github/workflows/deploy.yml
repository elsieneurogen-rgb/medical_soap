      #       🚀 Deploy SOAP Psiquiatria
      #       Repo: ${{ github.repository }}
      #       Commit: ${{ github.sha }}
      #       Status: ${{ job.status }}
      #       VPS: ${{ secrets.VPS_HOST }}

      # ── 4. Backup do banco (opcional) ───────────────────────
      # Descomentar se quiser backup automático do PostgreSQL
      # antes de cada deploy. O backup vai para /backup/ no VPS.
