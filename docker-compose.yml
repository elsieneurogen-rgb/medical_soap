# ═══════════════════════════════════════════════════════════════
#  SOAP Psiquiatria — Compose para VPS (EasyPanel)
# ═══════════════════════════════════════════════════════════════
#
# Serviços:
#   postgres   — banco de dados PostgreSQL (volume persistente)
#   backend    — Flask + Gunicorn (container Docker, build local)
#   nginx      — reverse proxy + serve frontend estático
#
# Redes:
#   app-net    — rede interna entre backend e postgres (não exposta)
#
# Portas expostas:
#   80, 443    — nginx (HTTP/HTTPS, acessível externamente)
#   5432       — PostgreSQL (opcional: remover se nginx faz tudo)
#
# ────────────────────────────────────────────────────────────────
#
# Uso:
#   docker compose up -d            # subir tudo
#   docker compose logs -f backend # ver logs do backend
#   docker compose down             # parar tudo (dados do postgres mantidos)
#
# ────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: soap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-changeme}
      POSTGRES_DB: ${DB_NAME:-soap_psiquiatria}
    ports:
      - "5432:5432"   # remover se não precisar acesso externo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-soap_psiquiatria}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-net

  # ── Backend Flask ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soap_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-soap_psiquiatria}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-changeme}
      - PORT=5000
      - ENTREZ_EMAIL=${ENTREZ_EMAIL:-}
      - ENTREZ_API_KEY=${ENTREZ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net
    # healthcheck simples: verifica se a API responde
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/pgx/lookup?gene=CYP2D6&drug=tamoxifeno"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # ── Nginx ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: soap_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"     # para HTTPS (ver notas no README)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/app/index.html:ro
      - ./server.py:/app/server.py:ro   # opcional: para debug
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net

# ── Volumes ────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Rede interna ───────────────────────────────────────────────
networks:
  app-net:
    driver: bridge
